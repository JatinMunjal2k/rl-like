<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL-like</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e8eef5; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
      #hud[hidden] { display: none; }
      #score { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 700; letter-spacing: 1px; }
      #score .blue { color: #4aa3ff; } #score .orange { color: #ff9a3c; }
      #fps { position: absolute; top: 12px; right: 16px; font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
      #banner { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
      #banner .title { font-size: 56px; font-weight: 800; }
      #banner .goalSpeed { font-size: 22px; font-weight: 600; opacity: .9; margin-top: 4px; }

      #bottomleft { position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
      #camMode { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); opacity: .55; }
      #camMode.on { opacity: 1; border-color: #7CFC9A; color: #7CFC9A; }
      #controller { font-size: 12px; opacity: .75; }
      #controller .ok { color: #7CFC9A; } #controller .warn { color: #ffd166; }

      #bottomright { position: absolute; right: 22px; bottom: 16px; display: flex; align-items: flex-end; gap: 18px; }
      #speed { text-align: right; font-variant-numeric: tabular-nums; margin-bottom: 14px; min-width: 110px; }
      #speed .value { font-size: 34px; font-weight: 800; line-height: 1; transition: font-size .12s ease-out; }
      #speed .unit { font-size: 12px; opacity: .7; letter-spacing: 1px; }
      #speed.max .value { color: #ff4d4d; font-size: 48px; animation: pulse .5s ease-in-out infinite alternate; }
      #speed.max .unit { color: #ff4d4d; opacity: 1; }
      @keyframes pulse { from { text-shadow: 0 0 4px rgba(255,77,77,.4); } to { text-shadow: 0 0 16px rgba(255,77,77,.95); } }
      #boostGauge { width: 132px; height: 132px; position: relative; }
      #boostGauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      #boostGauge .track { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 12; }
      #boostGauge .fill { fill: none; stroke: #ffb347; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .06s linear; }
      #boostGauge .fill.boosting { stroke: #ffd98a; }
      #boostGauge .fill.empty { stroke: #ff6b6b; }
      #boostValue { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      #boostLabel { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-size: 11px; letter-spacing: 2px; opacity: .7; }

      .menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 10; overflow: auto; }
      .menu[hidden] { display: none; }
      .menu-panel { background: #121a28; border: 1px solid #2a3a55; border-radius: 12px; padding: 28px 32px; min-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 12px; }
      .menu-panel.wide { min-width: 560px; }
      .menu-panel[hidden] { display: none; }
      .menu-title { margin: 0 0 8px; font-size: 32px; letter-spacing: 1px; }
      h2.menu-title { font-size: 22px; }
      .menu-hint { margin: 4px 0 0; font-size: 13px; opacity: .7; max-width: 520px; }
      .menu-button { font: inherit; font-size: 17px; padding: 12px 18px; border-radius: 8px; border: 1px solid #2f4a75; background: #1b2a44; color: #e8eef5; cursor: pointer; text-align: left; }
      .menu-button:hover { background: #24395f; }
      .focused { outline: 2px solid #ffd166; outline-offset: 2px; }
      .menu-row { display: flex; gap: 10px; margin-top: 8px; }
      .menu-row .menu-button { flex: 1; text-align: center; font-size: 15px; padding: 10px 14px; }
      .bind-table { display: flex; flex-direction: column; gap: 6px; }
      .bind-row { display: grid; grid-template-columns: 200px 140px 140px; gap: 8px; align-items: center; font-size: 14px; }
      .bind-head { opacity: .6; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
      .bind-cell { font-size: 14px; padding: 8px 10px; text-align: center; }
      .bind-cell.capturing { background: #5a4a10; border-color: #ffd166; }
      .slider-list { display: flex; flex-direction: column; gap: 8px; }
      .slider-row { display: grid; grid-template-columns: 260px 40px 90px 40px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
      .slider-title { font-weight: 600; }
      .slider-desc { font-size: 12px; opacity: .65; line-height: 1.35; margin-top: 2px; }
      .menu-panel.wide { min-width: 680px; max-width: 820px; }
      .slider-row.focused { background: rgba(255, 209, 102, .08); }
      .slider-value { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
      .menu-button.adj { padding: 6px 0; text-align: center; font-size: 16px; line-height: 1; }
      .slider-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      .slider-fill { height: 100%; background: #ffb347; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden>
      <div id="score"><span class="blue">BLUE 0</span> &nbsp;–&nbsp; <span class="orange">0 ORANGE</span></div>
      <div id="fps">— fps</div>
      <div id="banner"><div class="title"></div><div class="goalSpeed"></div></div>
      <div id="bottomleft">
        <div id="camMode" class="on">BALL CAM</div>
        <div id="controller">Loading…</div>
      </div>
      <div id="bottomright">
        <div id="speed"><div class="value">0</div><div class="unit">UU/S</div></div>
        <div id="boostGauge">
          <svg viewBox="0 0 132 132">
            <circle class="track" cx="66" cy="66" r="56" />
            <circle id="boostFill" class="fill" cx="66" cy="66" r="56" />
          </svg>
          <div id="boostValue">33</div>
          <div id="boostLabel">BOOST</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
