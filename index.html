<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL-like</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0f16; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #e8eef5; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
      #score { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 700; letter-spacing: 1px; }
      #score .blue { color: #4aa3ff; } #score .orange { color: #ff9a3c; }
      #status { position: absolute; left: 14px; bottom: 14px; font-size: 13px; line-height: 1.5; opacity: .9; max-width: 460px; }
      #status .ok { color: #7CFC9A; } #status .warn { color: #ffd166; }
      #banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 56px; font-weight: 800; display: none; }
      kbd { background: rgba(255,255,255,.12); border-radius: 3px; padding: 0 4px; font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="score"><span class="blue">BLUE 0</span> &nbsp;–&nbsp; <span class="orange">0 ORANGE</span></div>
      <div id="banner"></div>
      <div id="status">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
